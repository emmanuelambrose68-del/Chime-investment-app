<!-- ================================
     CRYPTO DEPOSIT
================================ -->

<section
    id="deposit"
    class="page">

    <div class="page-content">

        <button
            class="back-btn"
            onclick="showPage('dashboard')">

            ← Back

        </button>


        <h1>
            Deposit Crypto
        </h1>


        <p class="page-description">

            Fund your Chime account using
            cryptocurrency.

        </p>



        <!-- CRYPTO SELECTION -->

        <div class="form-card">


            <label>
                Select Cryptocurrency
            </label>


            <select id="cryptoCurrency">

                <option value="USDT">
                    USDT
                </option>

                <option value="USDC">
                    USDC
                </option>

                <option value="BTC">
                    Bitcoin (BTC)
                </option>

            </select>



            <label>
                Select Network
            </label>


            <select id="cryptoNetwork">

                <option value="TRC20">
                    TRON (TRC20)
                </option>

                <option value="ERC20">
                    Ethereum (ERC20)
                </option>

                <option value="BEP20">
                    BNB Smart Chain (BEP20)
                </option>

            </select>



            <label>
                Deposit Amount
            </label>


            <div class="input-wrapper">

                <span>
                    $
                </span>


                <input
                    type="number"
                    id="depositAmount"
                    placeholder="Enter USD amount"
                    min="1"
                    step="0.01">

            </div>



            <button
                class="primary-btn"
                onclick="generateDepositAddress()">

                Continue

            </button>


        </div>



        <!-- WALLET SECTION -->

        <div
            id="cryptoWallet"
            class="form-card"
            style="display:none;">


            <div class="crypto-icon">

                ₿

            </div>


            <h2>
                Send Crypto
            </h2>


            <p>

                Send the selected cryptocurrency
                to the wallet address below.

            </p>



            <!-- QR CODE -->

            <div
                id="depositQR"
                class="deposit-qr">

                QR

            </div>



            <label>
                Wallet Address
            </label>


            <div class="copy-address">

                <input
                    id="walletAddress"
                    type="text"
                    value=""
                    readonly>


                <button
                    onclick="copyWalletAddress()">

                    📋 Copy

                </button>

            </div>



            <div class="deposit-details">


                <div>

                    <span>
                        Asset
                    </span>

                    <strong
                        id="depositAsset">

                        USDT

                    </strong>

                </div>



                <div>

                    <span>
                        Network
                    </span>

                    <strong
                        id="depositNetwork">

                        TRC20

                    </strong>

                </div>



                <div>

                    <span>
                        Amount
                    </span>

                    <strong
                        id="depositDisplayAmount">

                        $0.00

                    </strong>

                </div>


            </div>



            <button
                class="primary-btn"
                onclick="confirmDeposit()">

                I've Sent the Crypto

            </button>



            <button
                class="secondary-btn"
                onclick="cancelDeposit()">

                Cancel

            </button>


            <p class="deposit-status">

                Deposit status:
                <strong>
                    Waiting for payment
                </strong>

            </p>


        </div>


    </div>

</section>
