<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chime Investment</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#080d18;
color:#172033;
}

button{
font-family:inherit;
border:0;
cursor:pointer;
}

.hidden{
display:none!important;
}


/* ================= WELCOME ================= */

#welcomePage{
min-height:100vh;
background:
radial-gradient(circle at 80% 10%,#253b70 0,transparent 35%),
linear-gradient(145deg,#080d18,#121d35);
color:white;
padding:35px 22px;
display:flex;
align-items:center;
justify-content:center;
}

.welcome{
width:100%;
max-width:500px;
text-align:center;
}

.logo{
width:92px;
height:92px;
margin:auto;
border-radius:28px;
background:linear-gradient(145deg,#ffffff,#dce3ef);
color:#101a2d;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
font-weight:900;
box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.brand{
margin-top:25px;
font-size:36px;
font-weight:900;
letter-spacing:-1px;
}

.tagline{
color:#9da9bd;
margin-top:9px;
font-size:15px;
}

.welcome-card{
margin-top:35px;
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.08);
border-radius:26px;
padding:18px;
backdrop-filter:blur(15px);
}

.feature{
display:flex;
align-items:center;
text-align:left;
gap:15px;
padding:17px 8px;
}

.feature-icon{
width:50px;
height:50px;
border-radius:17px;
background:#202c44;
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
}

.feature strong{
font-size:15px;
}

.feature p{
margin-top:5px;
font-size:12px;
color:#9da9bd;
}

.start-btn{
width:100%;
height:59px;
margin-top:25px;
border-radius:18px;
background:white;
color:#101a2d;
font-size:17px;
font-weight:800;
box-shadow:0 12px 30px rgba(0,0,0,.25);
}


/* ================= APP ================= */

#app{
min-height:100vh;
background:#f4f6fa;
padding-bottom:90px;
}


/* HEADER */

.header{
background:
radial-gradient(circle at 90% 0,#263b6d 0,transparent 38%),
#111a2d;
color:white;
padding:25px 20px 34px;
border-radius:0 0 30px 30px;
}

.header-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.header small{
color:#929fb5;
font-size:12px;
}

.header h1{
font-size:25px;
margin-top:5px;
}

.header-badge{
width:43px;
height:43px;
border-radius:14px;
background:#25324a;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
}


/* CONTENT */

.container{
width:calc(100% - 30px);
max-width:600px;
margin:-15px auto 0;
}


/* ================= PAGES ================= */

.page{
display:none;
}

.page.active{
display:block;
}


/* ================= BALANCE ================= */

.balance-card{
background:
linear-gradient(135deg,#18243a,#243555);
color:white;
border-radius:26px;
padding:23px;
box-shadow:0 15px 35px rgba(16,25,45,.2);
position:relative;
overflow:hidden;
}

.balance-card:after{
content:"";
position:absolute;
width:130px;
height:130px;
border-radius:50%;
background:rgba(255,255,255,.05);
right:-40px;
top:-40px;
}

.balance-label{
color:#aab6c9;
font-size:12px;
}

.balance-amount{
font-size:37px;
font-weight:900;
margin-top:7px;
letter-spacing:-1px;
}

.balance-bottom{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:17px;
}

.earnings{
color:#68d39b;
font-size:13px;
font-weight:bold;
}

.account-label{
font-size:10px;
color:#8f9db3;
}

.account-value{
font-size:11px;
font-weight:bold;
margin-top:3px;
}

.actions{
display:flex;
gap:10px;
margin-top:21px;
}

.actions button{
flex:1;
height:48px;
border-radius:14px;
font-weight:800;
}

.deposit{
background:white;
color:#121c30;
}

.withdraw{
background:#2e3d58;
color:white;
}


/* ================= QUICK ACTIONS ================= */

.section{
margin-top:25px;
}

.section-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.section-head h2{
font-size:19px;
}

.view{
background:none;
color:#237b59;
font-size:12px;
font-weight:bold;
}

.quick{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.quick button{
background:white;
border-radius:18px;
padding:13px 4px;
min-height:91px;
box-shadow:0 5px 18px rgba(20,30,50,.04);
}

.quick-icon{
display:block;
font-size:21px;
margin-bottom:8px;
}

.quick strong{
font-size:11px;
display:block;
}

.quick small{
font-size:9px;
color:#9298a3;
display:block;
margin-top:3px;
}


/* ================= PLANS ================= */

.plans{
display:grid;
gap:12px;
}

.plan{
background:white;
border-radius:22px;
padding:18px;
box-shadow:0 5px 20px rgba(20,30,50,.05);
}

.plan-header{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.plan-name{
font-size:16px;
font-weight:800;
margin-top:6px;
}

.plan-icon{
width:43px;
height:43px;
border-radius:14px;
background:#eef2f7;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
}

.badge{
display:inline-block;
background:#edf4f0;
color:#237b59;
font-size:9px;
font-weight:bold;
padding:5px 8px;
border-radius:7px;
}

.plan-description{
font-size:11px;
color:#8b929e;
margin-top:5px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin:16px 0;
}

.stats div{
background:#f6f7f9;
padding:10px 6px;
border-radius:11px;
}

.stats small{
display:block;
font-size:9px;
color:#8b929e;
}

.stats strong{
font-size:12px;
display:block;
margin-top:3px;
}

.invest-btn{
width:100%;
height:46px;
border-radius:13px;
background:#121c30;
color:white;
font-weight:800;
}


/* ================= PAGE TITLE ================= */

.page-title{
display:flex;
align-items:center;
gap:12px;
padding-top:25px;
margin-bottom:18px;
}

.back{
width:42px;
height:42px;
border-radius:13px;
background:white;
font-size:20px;
}

.page-title small{
font-size:10px;
color:#8d95a1;
}

.page-title h2{
font-size:21px;
margin-top:3px;
}


/* ================= PORTFOLIO ================= */

.portfolio-card{
background:white;
border-radius:22px;
padding:22px;
}

.portfolio-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.portfolio-value{
font-size:30px;
font-weight:900;
margin-top:7px;
}

.profit{
color:#237b59
